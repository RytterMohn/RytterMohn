name: Update Profile README

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "profile-data.json"
      - "scripts/**"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect live GitHub profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect_profile_data.py

      - name: Render README.md
        run: python3 scripts/render_profile_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md profile-data.json; then
            echo "No changes to commit."
            exit 0
          fi
          git add README.md profile-data.json
          git commit -m "chore(profile): refresh GitHub stars and PR contributions"
          git push
